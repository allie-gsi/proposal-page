<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex, nofollow">
<title>Green Services proposal</title>
<style>
body{margin:0;background:#F3F5F1;font-family:Inter,Arial,sans-serif;color:#1D2A22}
#msg{max-width:520px;margin:60px auto;padding:0 20px;text-align:center;font-size:17px;line-height:1.5}
#msg a{color:#1F6B3A}
</style>
<style id="pg-css"></style>
</head>
<body>
<div id="app"><div id="msg">Opening your proposal...</div></div>
<script>
// The only setting in this file. It is the public address of the Green Services proposal service
// (the same kind of address that is already in every proposal email). It holds no data and no secret.
var ENGINE_URL = '';          // filled in by the Green Services team when the service is ready
var PHONE = '';               // office number, filled in with ENGINE_URL
var WAIT_MS = 15000;

var app = document.getElementById('app');
var token = '';
var key = 'k' + Math.random().toString(36).slice(2) + Date.now().toString(36);

function say(html) { app.innerHTML = '<div id="msg">' + html + '</div>'; }
function call() { return PHONE ? ' or call us on ' + PHONE : ' or call us'; }
function oops() { say('We could not open this proposal right now. Please try again in a minute,' + call() + ' and we will help.'); }
function notFound() { say('We could not find this proposal. Please' + call().replace(' or call us', ' call us') + ' and we will send a new link.'); }

function timed(p) {
  return new Promise(function (ok, no) {
    var t = setTimeout(function () { no(new Error('slow')); }, WAIT_MS);
    p.then(function (r) { clearTimeout(t); ok(r); }, function (e) { clearTimeout(t); no(e); });
  });
}
function ask(body) {
  var opt = body ? { method: 'POST', body: JSON.stringify(body), headers: { 'Content-Type': 'text/plain;charset=utf-8' }, redirect: 'follow', credentials: 'omit', referrerPolicy: 'no-referrer' }
                 : { redirect: 'follow', credentials: 'omit', referrerPolicy: 'no-referrer' };
  var url = body ? ENGINE_URL : ENGINE_URL + (ENGINE_URL.indexOf('?') < 0 ? '?' : '&') + 'view=data&p=' + encodeURIComponent(token);
  return timed(fetch(url, opt)).then(function (r) { if (!r.ok) throw new Error('bad'); return r.json(); });
}

// The engine sends back the finished page text (the same layout as the PDF). It is our own text, with every
// client-typed word already made safe by the engine. We still only accept the exact shape we expect.
function show(d) {
  if (!d || d.v !== 1 || typeof d.kind !== 'string') return oops();
  if (d.kind === 'unknown') return notFound();
  if (typeof d.html !== 'string' || typeof d.css !== 'string') return oops();
  document.getElementById('pg-css').textContent = d.css;
  app.innerHTML = d.html;
  document.title = 'Green Services proposal';
  wire(d);
}

function wire(d) {
  var accept = document.getElementById('pd-accept');
  if (accept) setupSign(accept);
  var dl = document.getElementById('pd-download');   // engine marks the signed-copy button with this id
  if (dl && d.pdfB64) {
    dl.addEventListener('click', function (e) {
      e.preventDefault();
      var bin = atob(d.pdfB64), n = bin.length, a = new Uint8Array(n);
      for (var i = 0; i < n; i++) a[i] = bin.charCodeAt(i);
      var u = URL.createObjectURL(new Blob([a], { type: 'application/pdf' }));
      var x = document.createElement('a'); x.href = u; x.download = 'Green Services signed proposal.pdf';
      document.body.appendChild(x); x.click(); x.remove(); setTimeout(function () { URL.revokeObjectURL(u); }, 4000);
    });
  }
}

function setupSign(btn) {
  var cv = document.getElementById('pd-sig'), nm = document.getElementById('pd-name'), ctx = cv.getContext('2d');
  var drawing = false, ink = 0, strokes = 0, pts = 0, last = null;
  ctx.lineWidth = 3; ctx.lineCap = 'round'; ctx.strokeStyle = '#1D2A22';
  function pos(e) { var r = cv.getBoundingClientRect(); return { x: (e.clientX - r.left) * cv.width / r.width, y: (e.clientY - r.top) * cv.height / r.height }; }
  cv.addEventListener('pointerdown', function (e) { drawing = true; last = pos(e); strokes++; pts++; cv.setPointerCapture(e.pointerId); e.preventDefault(); });
  cv.addEventListener('pointermove', function (e) {
    if (!drawing) return; var p = pos(e); ctx.beginPath(); ctx.moveTo(last.x, last.y); ctx.lineTo(p.x, p.y); ctx.stroke();
    ink += Math.abs(p.x - last.x) + Math.abs(p.y - last.y); pts++; last = p; e.preventDefault();
  });
  function up() { drawing = false; }
  cv.addEventListener('pointerup', up); cv.addEventListener('pointercancel', up);
  var note = document.createElement('div'); note.style.cssText = 'color:#C62828;font-size:14px;margin-top:8px;min-height:18px'; note.setAttribute('role', 'alert');
  btn.parentNode.appendChild(note);
  var busy = false;
  btn.addEventListener('click', function () {
    if (busy) return;
    var name = (nm.value || '').replace(/\s+/g, ' ').trim();
    if ((name.match(/[A-Za-zÀ-ɏ]/g) || []).length < 2) { note.textContent = 'Please type your name.'; return; }
    if (pts < 4 || ink < 40) { note.textContent = 'Please sign in the box with your finger or mouse.'; return; }
    busy = true; btn.disabled = true; btn.textContent = 'Accepting...'; note.textContent = '';
    ask({ a: 'accept', p: token, name: name, sig: cv.toDataURL('image/png'), key: key })
      .then(function (d) {
        if (d && d.v === 1 && d.kind === 'accepted') return show(d);
        if (d && d.v === 1 && (d.kind === 'replaced' || d.kind === 'expired')) return show(d);
        throw new Error('bad');
      })
      .catch(function () { busy = false; btn.disabled = false; btn.textContent = 'Accept'; note.textContent = 'That did not go through. Nothing was recorded. Please press Accept again.'; });
  });
}

(function start() {
  var m = /[?&]p=([0-9a-f]{64})(?:&|$)/i.exec(location.search);
  if (!ENGINE_URL) return oops();
  if (!m) return notFound();
  token = m[1].toLowerCase();
  try { history.replaceState(null, '', location.pathname); } catch (e) {}
  ask().then(show).catch(oops);
})();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex, nofollow">
<title>Green Services proposal</title>
<style>
body{margin:0;background:#F3F5F1;font-family:Inter,Arial,sans-serif;color:#1D2A22}
#msg{max-width:520px;margin:60px auto;padding:0 20px;text-align:center;font-size:17px;line-height:1.5}
#msg a{color:#1F6B3A}
</style>
<style id="pg-css"></style>
</head>
<body>
<div id="app"><div id="msg">Opening your proposal...</div></div>
<script>
// The only setting in this file. It is the public address of the Green Services proposal service
// (the same kind of address that is already in every proposal email). It holds no data and no secret.
var ENGINE_URL = '';          // filled in by the Green Services team when the service is ready
var PHONE = '';               // office number, filled in with ENGINE_URL
var WAIT_MS = 15000;

var app = document.getElementById('app');
var token = '';

function say(html) { app.innerHTML = '<div id="msg">' + html + '</div>'; }
function call() { return PHONE ? ' or call us on ' + PHONE : ' or call us'; }
function oops() { say('We could not open this proposal right now. Please try again in a minute,' + call() + ' and we will help.'); }
function notFound() { say('We could not find this proposal. Please' + call().replace(' or call us', ' call us') + ' and we will send a new link.'); }

function timed(p) {
  return new Promise(function (ok, no) {
    var t = setTimeout(function () { no(new Error('slow')); }, WAIT_MS);
    p.then(function (r) { clearTimeout(t); ok(r); }, function (e) { clearTimeout(t); no(e); });
  });
}
function ask(body) {
  var opt = body ? { method: 'POST', body: JSON.stringify(body), headers: { 'Content-Type': 'text/plain;charset=utf-8' }, redirect: 'follow', credentials: 'omit', referrerPolicy: 'no-referrer' }
                 : { redirect: 'follow', credentials: 'omit', referrerPolicy: 'no-referrer' };
  var url = body ? ENGINE_URL : ENGINE_URL + (ENGINE_URL.indexOf('?') < 0 ? '?' : '&') + 'view=data&p=' + encodeURIComponent(token);
  return timed(fetch(url, opt)).then(function (r) { if (!r.ok) throw new Error('bad'); return r.json(); });
}

// The engine sends back the finished page text (the same layout as the PDF). It is our own text, with every
// client-typed word already made safe by the engine. We still only accept the exact shape we expect.
function show(d) {
  if (!d || d.v !== 1 || typeof d.kind !== 'string') return oops();
  if (d.kind === 'unknown') return notFound();
  if (typeof d.html !== 'string' || typeof d.css !== 'string') return oops();
  document.getElementById('pg-css').textContent = d.css;
  app.innerHTML = d.html;
  document.title = 'Green Services proposal';
  wire(d);
}

function wire(d) {
  pdWire({ show: show, submit: function (body, ok, no) { body.p = token; ask(body).then(ok, no); } });
  var dl = document.getElementById('pd-download');   // engine marks the signed-copy button with this id
  if (dl && d.pdfB64) {
    dl.addEventListener('click', function (e) {
      e.preventDefault();
      var bin = atob(d.pdfB64), n = bin.length, a = new Uint8Array(n);
      for (var i = 0; i < n; i++) a[i] = bin.charCodeAt(i);
      var u = URL.createObjectURL(new Blob([a], { type: 'application/pdf' }));
      var x = document.createElement('a'); x.href = u; x.download = 'Green Services signed proposal.pdf';
      document.body.appendChild(x); x.click(); x.remove(); setTimeout(function () { URL.revokeObjectURL(u); }, 4000);
    });
  }
}

/* The client proposal page's own code (Version C, Allie 11/19). ONE source file: it is copied word for word into the page on
   proposals.mygreenservices.com (repo proposal-page, index.html) and into the board's own Accept page (AcceptMain.js). A test checks both copies.
   pdWire(host): host.submit(body, onDone, onFail) sends one request to the board and calls onDone(answer) or onFail().
   It holds no data and no secret. Everything it shows from the client is set with textContent, never as HTML. */
function pdWire(host) {
  var doc = document, win = window;
  function $(id) { return doc.getElementById(id); }
  function key() { return 'k' + Math.random().toString(36).slice(2) + Date.now().toString(36); }
  var sendKey = key();

  /* ---- print ---- */
  var pr = $('pd-print');
  if (pr) pr.addEventListener('click', function () { win.print(); });

  /* ---- photos: tap one to see it big, with arrows and swipe ---- */
  var imgs = [].slice.call(doc.querySelectorAll('img.pdimg')), cur = 0, lb = null, tx = null;
  function lbShow() {
    if (!lb) return;
    lb.querySelector('img').src = imgs[cur].src;
    lb.querySelector('.c').textContent = imgs.length > 1 ? (cur + 1) + ' of ' + imgs.length : '';
  }
  function lbClose() { if (lb) { lb.remove(); lb = null; doc.removeEventListener('keydown', lbKey); } }
  function lbStep(d) { if (imgs.length > 1) { cur = (cur + d + imgs.length) % imgs.length; lbShow(); } }
  function lbKey(e) { if (e.key === 'Escape') lbClose(); else if (e.key === 'ArrowRight') lbStep(1); else if (e.key === 'ArrowLeft') lbStep(-1); }
  function lbOpen(i) {
    cur = i; lbClose();
    lb = doc.createElement('div'); lb.id = 'pd-lb'; lb.setAttribute('role', 'dialog'); lb.setAttribute('aria-label', 'Photo');
    lb.innerHTML = '<img alt=""><button type="button" class="x" aria-label="Close" style="top:12px;right:12px">&times;</button><div class="c"></div>' +
      (imgs.length > 1 ? '<button type="button" class="p" aria-label="Previous photo" style="left:10px">&#8249;</button><button type="button" class="n" aria-label="Next photo" style="right:10px">&#8250;</button>' : '');
    doc.body.appendChild(lb); lbShow();
    lb.addEventListener('click', function (e) {
      var t = e.target;
      if (t.className === 'x' || t === lb) lbClose(); else if (t.className === 'p') lbStep(-1); else if (t.className === 'n') lbStep(1);
    });
    lb.addEventListener('touchstart', function (e) { tx = e.touches[0].clientX; }, { passive: true });
    lb.addEventListener('touchend', function (e) { if (tx == null) return; var dx = e.changedTouches[0].clientX - tx; tx = null; if (Math.abs(dx) > 50) lbStep(dx < 0 ? 1 : -1); }, { passive: true });
    doc.addEventListener('keydown', lbKey);
  }
  imgs.forEach(function (im, i) {
    im.addEventListener('click', function () { lbOpen(i); });
    im.addEventListener('keydown', function (e) { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); lbOpen(i); } });
  });

  /* ---- the three choices (only on an open proposal) ---- */
  var actions = $('pd-actions');
  if (!actions) return;
  var panels = { accept: $('pd-p-accept'), decline: $('pd-p-decline'), changes: $('pd-p-changes') }, msg = $('pd-msg'), busy = false;
  function say(t) { msg.textContent = t || ''; }
  function show(which) {
    actions.hidden = !!which;
    Object.keys(panels).forEach(function (k) { if (panels[k]) panels[k].hidden = k !== which; });
    say('');
    var p = panels[which]; if (p && p.scrollIntoView) p.scrollIntoView({ block: 'start', behavior: 'smooth' });
  }
  $('pd-go-accept').addEventListener('click', function () { show('accept'); });
  $('pd-go-changes').addEventListener('click', function () { show('changes'); });
  $('pd-go-decline').addEventListener('click', function () { show('decline'); });
  [].forEach.call(doc.querySelectorAll('.pd-back'), function (b) { b.addEventListener('click', function () { show(''); }); });

  function thanks(title, text) {
    var c = $('pd-actions').parentNode;
    ['pd-actions', 'pd-p-accept', 'pd-p-decline', 'pd-p-changes', 'pd-msg'].forEach(function (id) { var e = $(id); if (e) e.remove(); });
    var d = doc.createElement('div'); d.className = 'panel'; d.style.textAlign = 'center'; d.setAttribute('role', 'status');
    var h = doc.createElement('h2'); h.textContent = title; var p = doc.createElement('div'); p.textContent = text; d.appendChild(h); d.appendChild(p);
    var at = c.querySelector('.terms'); c.insertBefore(d, at); d.scrollIntoView({ block: 'center' });
  }
  function send(btn, label, body, ok) {
    if (busy) return; busy = true; btn.disabled = true; btn.textContent = 'Sending...'; say('');
    body.key = sendKey;
    host.submit(body, function (d) { busy = false; if (!ok(d)) { btn.disabled = false; btn.textContent = label; say('That did not go through. Nothing was recorded. Please press the button again.'); } },
      function () { busy = false; btn.disabled = false; btn.textContent = label; say('That did not go through. Nothing was recorded. Please press the button again.'); });
  }

  /* decline */
  var reason = '';
  [].forEach.call(doc.querySelectorAll('#pd-reasons label'), function (l) {
    l.addEventListener('click', function () { [].forEach.call(doc.querySelectorAll('#pd-reasons label'), function (x) { x.className = ''; }); l.className = 'on'; reason = l.textContent; });
  });
  $('pd-send-decline').addEventListener('click', function () {
    send(this, 'Send', { a: 'decline', reason: reason, note: $('pd-dnote').value.slice(0, 1000) }, function (d) {
      if (d && d.v === 1 && d.kind === 'declined') { thanks('Thank you for letting us know.', 'We have noted that this is not a fit right now. If anything changes, just reply to our email.'); return true; }
      if (d && d.v === 1 && d.kind === 'accepted') { host.show(d); return true; } return false;
    });
  });

  /* request changes */
  $('pd-send-changes').addEventListener('click', function () {
    var note = $('pd-cnote').value.replace(/\s+/g, ' ').trim();
    if (note.length < 3) { say('Please tell us what you would like changed.'); return; }
    send(this, 'Send', { a: 'changes', note: $('pd-cnote').value.slice(0, 1000) }, function (d) {
      if (d && d.v === 1 && d.kind === 'changes') { thanks('Got it, we are on it.', 'We will send you a revised proposal. You will get a new email when it is ready.'); return true; }
      if (d && d.v === 1 && d.kind === 'accepted') { host.show(d); return true; } return false;
    });
  });

  /* accept: sign with finger, mouse or pen (pointer events), or type the name */
  var cv = $('pd-sig'), nm = $('pd-name'), ctx = cv.getContext('2d'), strokes = [], line = null, drawing = false, ink = 0, typed = false;
  ctx.lineWidth = 4; ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.strokeStyle = '#1D2A22';
  function pos(e) { var r = cv.getBoundingClientRect(); return [Math.round((e.clientX - r.left) * cv.width / r.width), Math.round((e.clientY - r.top) * cv.height / r.height)]; }
  cv.addEventListener('pointerdown', function (e) {
    if (typed) return; drawing = true; line = [pos(e)]; strokes.push(line); ctx.beginPath(); ctx.moveTo(line[0][0], line[0][1]);
    try { cv.setPointerCapture(e.pointerId); } catch (x) {} e.preventDefault();
  });
  cv.addEventListener('pointermove', function (e) {
    if (!drawing) return; var p = pos(e), q = line[line.length - 1]; line.push(p); ctx.lineTo(p[0], p[1]); ctx.stroke();
    ink += Math.abs(p[0] - q[0]) + Math.abs(p[1] - q[1]); e.preventDefault();
  });
  function up() { drawing = false; line = null; }
  cv.addEventListener('pointerup', up); cv.addEventListener('pointercancel', up);
  function clear() { ctx.clearRect(0, 0, cv.width, cv.height); strokes = []; ink = 0; typed = false; cv.style.opacity = 1; $('pd-type').textContent = 'Type your name instead'; }
  $('pd-clear').addEventListener('click', clear);
  $('pd-type').addEventListener('click', function () {
    if (typed) { clear(); return; }
    var name = (nm.value || '').replace(/\s+/g, ' ').trim();
    if (name.length < 2) { say('Please type your name above first.'); nm.focus(); return; }
    clear(); typed = true; ctx.fillStyle = '#1D2A22'; ctx.font = '72px "Brush Script MT","Segoe Script",cursive'; ctx.textBaseline = 'middle'; ctx.fillText(name.slice(0, 40), 24, cv.height / 2, cv.width - 48);
    this.textContent = 'Sign by hand instead'; say('');
  });
  $('pd-accept').addEventListener('click', function () {
    var name = (nm.value || '').replace(/\s+/g, ' ').trim();
    if ((name.match(/[A-Za-zÀ-ɏ]/g) || []).length < 2) { say('Please type your name.'); return; }
    if (!typed && (strokes.length < 1 || ink < 40)) { say('Please sign in the box, or choose "Type your name instead".'); return; }
    var png = cv.toDataURL('image/png');
    send(this, 'Confirm and accept', { a: 'accept', name: name, sig: png, signature: { strokes: typed ? [] : strokes, png: png, typed: typed } }, function (d) {
      if (d && d.v === 1 && (d.kind === 'accepted' || d.kind === 'replaced' || d.kind === 'expired')) { host.show(d); return true; } return false;
    });
  });
}

(function start() {
  var m = /[?&]p=([0-9a-f]{64})(?:&|$)/i.exec(location.search);
  if (!ENGINE_URL) return oops();
  if (!m) return notFound();
  token = m[1].toLowerCase();
  try { history.replaceState(null, '', location.pathname); } catch (e) {}
  ask().then(show).catch(oops);
})();
</script>
</body>
</html>
